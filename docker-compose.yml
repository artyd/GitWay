# Розгортання GitШлях: Postgres (спільний прогрес + рейтинг) + застосунок.
# Запуск:  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gitway
      POSTGRES_PASSWORD: gitway        # ЗМІНІТЬ на проді
      POSTGRES_DB: gitway
    volumes:
      - gitway-db:/var/lib/postgresql/data
    # Порт назовні НЕ публікуємо: застосунок ходить у БД по внутрішній мережі (host = db).
    # Якщо потрібен зовнішній доступ до Postgres — розкоментуйте й оберіть вільний порт,
    # напр. "5433:5432" (5432 на хості вже зайнято іншим Postgres).
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      # Схема таблиць створюється автоматично при першому запиті.
      DATABASE_URL: postgres://gitway:gitway@db:5432/gitway
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:3000"
    restart: unless-stopped

volumes:
  # Зовнішній том: НЕ видаляється навіть при `docker compose down -v` / recreate.
  # Дані прогресу зберігаються назавжди. Прив'язано до наявного тому gitway_gitway-db.
  # Один раз на сервері (ідемпотентно): docker volume create gitway_gitway-db
  gitway-db:
    external: true
    name: gitway_gitway-db
